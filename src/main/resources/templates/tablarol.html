<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trips Listado de Roles</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Roles de Tienda Electrónica</h1>

    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>NomRol</th>
                <th>Descripcion</th>
                <th>Activo</th>
                <th>FechaCreación</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="rol : ${roles}">
                <td th:text="${rol.id}"></td>
                <td th:text="${rol.nomRol}"></td>
                <td th:text="${rol.descripcion}"></td>
                <td th:text="${rol.activo ? 'Sí' : 'No'}"></td>
                <td th:text="${#dates.format(rol.fechaCreacion, 'dd/MM/yyyy')}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
